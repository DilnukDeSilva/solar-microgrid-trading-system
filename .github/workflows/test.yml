name: Test

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  dotnet:
    name: Web API + web app build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # The solution holds both SmartSolar.Api and SmartSolar.Web.
      - run: dotnet build WebService/SmartSolar.slnx -c Release
      # shortcut: no test project exists yet, so this only proves the build; add an xUnit project to the .slnx and it runs here.
      - run: dotnet test WebService/SmartSolar.slnx -c Release --no-build

  android:
    name: Android build and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MobileApp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # local.properties is not committed; the Maps key falls back to an empty string, which is fine for a build.
      - run: ./gradlew assembleDebug testDebugUnitTest
