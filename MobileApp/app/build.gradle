plugins {
    id 'com.android.application'
}

def localProps = new Properties()
def localFile = rootProject.file('local.properties')
if (localFile.exists()) localFile.withInputStream { localProps.load(it) }

android {
    namespace 'lk.smartsolar.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'lk.smartsolar.mobile'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
        buildConfigField 'String', 'API_BASE_URL', '"http://10.0.2.2:5080/api/"'
        manifestPlaceholders = [MAPS_API_KEY: localProps.getProperty('MAPS_API_KEY', '')]
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.google.android.gms:play-services-maps:19.0.0'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
}
