plugins {
    id 'com.android.application'
}

android {
    namespace 'lk.smartsolar.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'lk.smartsolar.mobile'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
        buildConfigField 'String', 'API_BASE_URL', '"http://10.0.2.2:5080/api/"'
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
}
